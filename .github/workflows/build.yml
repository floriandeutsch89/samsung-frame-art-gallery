name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'VERSION'
      - 'docker/**'
      - 'src/**'
      - 'requirements.txt'
      - 'src/frontend/package*.json'
      - '.github/workflows/build.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Read VERSION
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '\n')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/samsung-frame-art-gallery:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/samsung-frame-art-gallery:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/samsung-frame-art-gallery:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/samsung-frame-art-gallery:buildcache,mode=max
