name: Local Setup Tests

on:
  pull_request:
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/test.yml'

jobs:
  test-local-setup:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.13']

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Run local setup tests
        run: python tests/test_local_setup.py
