[project]
name = "samsung-frame-art-gallery"
version = "1.0.0"
description = "Self-hosted web application for managing artwork on Samsung Frame TVs"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Contributors"}]
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.7",
    "Pillow>=11.1.0",
    "pillow-heif>=0.18.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.black]
line-length = 100
target-version = ['py313']

[tool.ruff]
line-length = 100
target-version = "py313"
select = ["E", "F", "W"]
