# Docker Compose - Pull pre-built image from GHCR
# This compose file pulls the image instead of building locally
# Useful for deployment without building

version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    container_name: frame-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-artgallery.example.com}
    networks:
      - caddy-artgallery
    depends_on:
      - app

  app:
    # Pull pre-built image from GHCR instead of building
    image: ghcr.io/YOUR_USERNAME/samsung-frame-art-gallery:latest
    container_name: frame-app
    networks:
      - caddy-artgallery
    ports:
      - "8080:8080"
    volumes:
      - ${IMAGES_DIR:-./images}:/images:ro
      - ./data/thumbnails:/thumbnails
      - ./data:/app/data
    environment:
      - TV_IP=${TV_IP:-}
      - DEFAULT_CROP_PERCENT=${DEFAULT_CROP_PERCENT:-5}
      - DEFAULT_MATTE_PERCENT=${DEFAULT_MATTE_PERCENT:-10}
    restart: unless-stopped

networks:
  caddy-artgallery:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
